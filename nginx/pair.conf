# pair.dendenx.cloud — статика + прокси к rw-pair.
# Подключить в nginx: include /path/to/rw-pair/nginx/pair.conf;
# Сертификаты и корневой server настраиваются на реальном сервере.
# rw-pair должен быть доступен по имени сервиса в той же docker-сети.
server {
    listen 443 ssl;
    server_name pair.dendenx.cloud;

    # ssl_certificate /etc/letsencrypt/live/pair.dendenx.cloud/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/pair.dendenx.cloud/privkey.pem;

    # Публичный create запрещён: микросервис принимает его только
    # из docker-сети/localhost, nginx его не проксирует.
    location = /pair/create {
        return 404;
    }

    location = /pair {
        return 301 /pair/;
    }

    location ^~ /pair/ {
        location = /pair/redeem {
            proxy_pass http://rw-pair:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 4k;
        }

        location = /pair/health {
            proxy_pass http://rw-pair:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Статика: static/index.html монтируется в /usr/share/nginx/html/pair/
        root /usr/share/nginx/html;
        try_files $uri $uri/ /pair/index.html;
    }
}

server {
    listen 80;
    server_name pair.dendenx.cloud;
    return 301 https://$host$request_uri;
}
