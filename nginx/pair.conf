# pair.dendenx.cloud — статика в корне + прокси к rw-pair.
# Подключить в nginx: include /path/to/rw-pair/nginx/pair.conf;
# Статика из static/ копируется в /var/www/rw-pair/ на сервере.
# rw-pair слушает 127.0.0.1:8090 на хосте (ports в docker-compose.yml),
# порт наружу не публикуется.
# Публичный create запрещён: микросервис принимает его только
# из docker-сети/localhost, nginx его не проксирует.
server {
    server_name pair.dendenx.cloud;

    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    http2 on;

    ssl_certificate "/etc/nginx/ssl/dendenx.cloud/fullchain.pem";
    ssl_certificate_key "/etc/nginx/ssl/dendenx.cloud/privkey.pem";
    ssl_trusted_certificate "/etc/nginx/ssl/dendenx.cloud/fullchain.pem";

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    location = /pair/create {
        return 404;
    }

    location = /pair/redeem {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4k;
    }

    location = /pair/health {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    }

    # Статика в корне: / -> /var/www/rw-pair/index.html,
    # /lottie.min.js -> /var/www/rw-pair/lottie.min.js.
    # Внимание: fallback тут /index.html, а не /pair/index.html —
    # alias отрезает префикс, и /pair/index.html искался бы как
    # /var/www/rw-pair/pair/index.html, которого нет.
    location ^~ / {
        alias /var/www/rw-pair/;
        try_files $uri $uri/ /index.html;
    }
}
