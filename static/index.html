<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подключение подписки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=Montserrat:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<script src="lottie.min.js"></script>
<style>
html,body{min-height:100vh;margin:0;padding:0;background-color:#161b23;background-image:linear-gradient(to right, rgba(128,128,128,0.05) 1px, transparent 1px),linear-gradient(to bottom, rgba(128,128,128,0.05) 1px, transparent 1px);background-size:60px 60px;background-attachment:fixed;color:#ffffff;font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased}
.animated-background{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 40% at 25% 40%, rgba(151,117,250,0.08), transparent 50%),radial-gradient(ellipse 50% 50% at 85% 85%, rgba(34,211,238,0.06), transparent 50%)}
.app-layout{display:flex;flex-direction:column;min-height:100vh;position:relative;z-index:1}
.main-container{max-width:800px;width:100%;margin:0 auto;padding:24px 16px;box-sizing:border-box;animation:fadeIn 0.5s ease-in-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.header-wrapper{position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(22,27,35,0.8);border-bottom:1px solid rgba(255,255,255,0.05);padding:12px 16px}
@media (min-width:768px){.header-wrapper{border-radius:0 0 16px 16px}}
.header-inner{max-width:800px;margin:0 auto;display:flex;align-items:center;gap:10px}
.header-title{font-family:'Unbounded',sans-serif;font-weight:600;font-size:14px;letter-spacing:.04em;color:#c9d1d9}
.header-badge{font-family:'Fira Mono',monospace;font-size:11px;color:#22d3ee;background:rgba(34,211,238,0.1);border:1px solid rgba(34,211,238,0.2);border-radius:9999px;padding:3px 8px}
.glass-card{position:relative;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:16px;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:20px;transition:background 0.3s ease,border-color 0.3s ease,box-shadow 0.3s ease}
.glass-card:hover{border-color:rgba(34,211,238,0.3);box-shadow:0 20px 40px rgba(0,0,0,0.3)}
.hero-animation{width:180px;height:180px;margin:0 auto}
h1{font-family:'Unbounded',sans-serif;font-weight:600;font-size:22px;line-height:1.3;margin:8px 0;text-align:center}
h2{font-family:'Unbounded',sans-serif;font-weight:600;font-size:16px;margin:20px 0 12px;color:#c9d1d9}
.subtitle{color:#8b949e;font-size:14px;line-height:1.6;text-align:center;margin:0 0 16px}
.info-block{padding:10px 12px;border-radius:8px;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.5}
.info-block-cyan{background:linear-gradient(135deg, rgba(34,211,238,0.1) 0%, rgba(6,182,212,0.05) 100%);border:1px solid rgba(34,211,238,0.2);color:#b1bac4}
.info-block-red{background:linear-gradient(135deg, rgba(250,82,82,0.1) 0%, rgba(224,49,49,0.05) 100%);border:1px solid rgba(250,82,82,0.2);color:#fca5a5}
.info-block-green{background:linear-gradient(135deg, rgba(64,192,87,0.1) 0%, rgba(55,178,77,0.05) 100%);border:1px solid rgba(64,192,87,0.2);color:#86efac}
label{font-size:13px;color:#8b949e;display:block;margin-bottom:6px}
#redeem-form{margin-top:16px}
#code{font-family:'Fira Mono',monospace;font-size:20px;font-weight:500;letter-spacing:.4em;text-align:center;width:100%;box-sizing:border-box;padding:14px 12px;background:rgba(255,255,255,0.02);border:1px solid #30363d;border-radius:8px;color:#c9d1d9;outline:none;transition:border-color 0.2s ease,box-shadow 0.2s ease}
#code:focus{border-color:rgba(34,211,238,0.5);box-shadow:0 0 12px rgba(34,211,238,0.2)}
#code::placeholder{color:#6e7681}
.btn-primary{background:rgba(34,211,238,0.15);color:#22d3ee;border:1px solid rgba(34,211,238,0.3);border-radius:8px;padding:8px 16px;font-family:'Montserrat',sans-serif;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s ease;width:100%;height:48px;margin-top:12px}
.btn-primary:hover{background:rgba(34,211,238,0.25);border-color:rgba(34,211,238,0.5);box-shadow:0 0 12px rgba(34,211,238,0.2)}
.btn-primary:disabled{opacity:.6;cursor:default}
#error{margin:16px 0 0}
.apps-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.app-button{position:relative;display:flex;align-items:center;flex:1 1 auto;padding:0 16px;height:48px;min-width:0;overflow:hidden;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-left:3px solid rgba(255,255,255,0.08);border-radius:8px;cursor:pointer;transition:all 0.2s ease;user-select:none;font-family:'Montserrat',sans-serif}
.app-button:hover{background:rgba(255,255,255,0.05);border-left-color:rgba(255,255,255,0.25)}
.app-button-active,.app-button-active:hover{background:linear-gradient(90deg, rgba(34,211,238,0.12) 0%, rgba(34,211,238,0.04) 100%);border-color:rgba(34,211,238,0.2);border-left-color:#22d3ee;box-shadow:inset 4px 0 12px -4px rgba(34,211,238,0.3),0 0 12px rgba(34,211,238,0.1)}
.app-button .app-name{color:rgba(255,255,255,0.85);font-size:15px;font-weight:600;white-space:nowrap;z-index:1}
.app-button-active .app-name{color:#67e8f9}
.app-button .app-id{margin-left:auto;font-family:'Fira Mono',monospace;font-size:12px;color:#6e7681}
#selected{margin-top:16px}
#sub-url{font-family:'Fira Mono',monospace;font-size:13px;width:100%;box-sizing:border-box;padding:12px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#c9d1d9;outline:none}
#copied{margin:8px 0 0}
@media (max-width:480px){.hero-animation{width:150px;height:150px}h1{font-size:19px}.glass-card{padding:16px}}
</style>
</head>
<body>
<div class="animated-background"></div>
<div class="app-layout">
<header class="header-wrapper"><div class="header-inner"><span class="header-title">RW Pair</span><span class="header-badge">pair.dendenx.cloud</span></div></header>
<main class="main-container">
<div class="glass-card">
<div id="lottie" class="hero-animation" aria-hidden="true"></div>
<h1>Подключение подписки</h1>
<p class="subtitle">Введите 6-значный код из Telegram-бота, чтобы получить ссылку на подписку на этом компьютере.</p>
<div class="info-block info-block-cyan"><span>Код действует 5 минут и работает один раз. Без Telegram на ПК и без копирования ссылки из бота.</span></div>
<form id="redeem-form">
<label for="code">Код из бота</label>
<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required>
<button type="submit" class="btn-primary" id="submit-btn">Получить подписку</button>
</form>
<p id="error" class="info-block info-block-red" hidden></p>
<section id="subs" hidden>
<h2>Выберите подписку</h2>
<div id="sub-list" class="apps-grid"></div>
<div id="selected" hidden>
<label for="sub-url">Ссылка подписки</label>
<input id="sub-url" readonly>
<button id="copy-btn" type="button" class="btn-primary">Копировать ссылку</button>
<p id="copied" class="info-block info-block-green" hidden>Скопировано</p>
</div>
</section>
</div>
</main>
</div>
<script>
(function () {
  var box = document.getElementById('lottie');
  if (window.lottie && box) {
    try {
      window.lottie.loadAnimation({ container: box, renderer: 'svg', loop: true, autoplay: true, path: 'mottyemojianim_agadnswaaut5oes.json' });
    } catch (err) { box.style.display = 'none'; }
  } else if (box) { box.style.display = 'none'; }
})();
const form = document.getElementById('redeem-form');
const codeInput = document.getElementById('code');
const submitBtn = document.getElementById('submit-btn');
const errorEl = document.getElementById('error');
const subsEl = document.getElementById('subs');
const listEl = document.getElementById('sub-list');
const selectedEl = document.getElementById('selected');
const urlInput = document.getElementById('sub-url');
const copyBtn = document.getElementById('copy-btn');
const copiedEl = document.getElementById('copied');
function showError(msg) { errorEl.textContent = msg; errorEl.hidden = false; }
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = codeInput.value.trim();
  if (!/^[0-9]{6}$/.test(code)) { showError('Введите 6 цифр.'); return; }
  errorEl.hidden = true;
  subsEl.hidden = true;
  selectedEl.hidden = true;
  submitBtn.disabled = true;
  try {
    const resp = await fetch('/pair/redeem', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
    if (resp.status === 404) { showError('Код не найден. Проверьте код или запросите новый в боте.'); return; }
    if (resp.status === 410) { showError('Код истёк. Запросите новый код в боте.'); return; }
    if (resp.status === 429) { showError('Слишком много попыток. Подождите минуту.'); return; }
    if (resp.status === 502 || resp.status === 503) { showError('Сервис временно недоступен. Повторите ввод — код не сгорел.'); return; }
    if (!resp.ok) { showError('Не удалось получить подписку. Попробуйте ещё раз.'); return; }
    const data = await resp.json();
    if (!data.subscriptions || data.subscriptions.length === 0) { showError('У пользователя нет подписок.'); return; }
    listEl.innerHTML = '';
    data.subscriptions.forEach((sub) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'app-button';
      const name = document.createElement('span');
      name.className = 'app-name';
      name.textContent = sub.label || sub.id;
      const id = document.createElement('span');
      id.className = 'app-id';
      id.textContent = sub.id;
      btn.appendChild(name);
      btn.appendChild(id);
      btn.addEventListener('click', () => {
        listEl.querySelectorAll('.app-button').forEach((b) => b.classList.remove('app-button-active'));
        btn.classList.add('app-button-active');
        urlInput.value = sub.subscription_url;
        selectedEl.hidden = false;
        copiedEl.hidden = true;
      });
      listEl.appendChild(btn);
    });
    subsEl.hidden = false;
  } catch (err) {
    showError('Нет связи с сервером. Проверьте соединение и попробуйте ещё раз.');
  } finally {
    submitBtn.disabled = false;
  }
});
copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(urlInput.value);
    copiedEl.hidden = false;
  } catch (err) {
    urlInput.select();
    document.execCommand('copy');
    copiedEl.hidden = false;
  }
});
</script>
</body>
</html>
